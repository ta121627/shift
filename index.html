<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="シフト管理表">
<meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>シフト管理表</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
    background-color: #F2F2F7;
    color: #000000;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  body {
    padding-bottom: calc(83px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  input, button, textarea {
    font-family: inherit;
  }

  /* ===== Header ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background-color: rgba(249, 249, 249, 0.82);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid #C6C6C8;
    padding-top: env(safe-area-inset-top);
  }
  .header-inner {
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
  }
  .header-title {
    font-size: 17px;
    font-weight: 600;
    color: #000000;
  }
  .header-btn {
    font-size: 16px;
    color: #007AFF;
    background: none;
    border: none;
    font-weight: 400;
    cursor: pointer;
    padding: 6px 2px;
  }
  .header-btn.add {
    font-size: 26px;
    line-height: 1;
    font-weight: 300;
  }

  /* ===== Pages ===== */
  .page { display: none; padding: 16px; }
  .page.active { display: block; }

  /* ===== Today view ===== */
  .today-card {
    background-color: #FFFFFF;
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 22px;
    text-align: center;
  }
  .today-date {
    font-size: 15px;
    color: #8E8E93;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .today-dow {
    font-size: 52px;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: 1px;
  }
  .today-dow.sat { color: #007AFF; }
  .today-dow.sun { color: #FF3B30; }
  .today-dow.weekday { color: #000000; }
  .today-count {
    font-size: 14px;
    color: #8E8E93;
    margin-top: 8px;
  }

  .section-label {
    font-size: 13px;
    color: #6D6D72;
    font-weight: 400;
    margin: 0 4px 8px;
    text-transform: none;
  }

  .work-list {
    background-color: #FFFFFF;
    border-radius: 14px;
    overflow: hidden;
  }
  .work-row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 0.5px solid #E5E5EA;
  }
  .work-row:last-child { border-bottom: none; }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 17px;
    font-weight: 600;
    margin-right: 13px;
    flex-shrink: 0;
  }
  .work-name {
    font-size: 17px;
    font-weight: 400;
  }

  .empty-state {
    background-color: #FFFFFF;
    border-radius: 14px;
    padding: 38px 20px;
    text-align: center;
    color: #8E8E93;
    font-size: 15px;
  }
  .empty-state .big { font-size: 34px; margin-bottom: 10px; }

  /* ===== Weekly grid ===== */
  .grid-wrap {
    background-color: #FFFFFF;
    border-radius: 14px;
    overflow: hidden;
  }
  .grid-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .grid-table th, .grid-table td {
    text-align: center;
    padding: 0;
  }
  .grid-head th { vertical-align: middle; }
  .grid-head .name-col {
    text-align: left;
    padding-left: 16px;
    width: 24%;
    font-size: 14px;
    font-weight: 600;
    color: #8E8E93;
    border-bottom: 0.5px solid #E5E5EA;
  }
  .grid-head .dow-th {
    height: 30px;
    font-size: 13px;
    font-weight: 600;
    color: #8E8E93;
    padding-top: 8px;
  }
  .grid-head .dow-th.sat-h { color: #007AFF; }
  .grid-head .dow-th.sun-h { color: #FF3B30; }
  .grid-head .date-th {
    height: 36px;
    border-bottom: 0.5px solid #E5E5EA;
    padding-bottom: 7px;
    vertical-align: top;
  }
  .grid-head .date-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 27px;
    height: 27px;
    padding: 0 4px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    color: #000000;
  }
  .grid-head .date-th.today .date-num {
    background-color: #007AFF;
    color: #FFFFFF;
  }
  .grid-head .today-col { background-color: #EAF3FF; }
  .grid-head .dow-th.today-col { border-radius: 8px 8px 0 0; }
  .grid-body td {
    height: 50px;
    border-bottom: 0.5px solid #E5E5EA;
    vertical-align: middle;
  }
  .grid-body tr:last-child td { border-bottom: none; }
  .grid-body td.name-cell {
    text-align: left;
    padding-left: 16px;
    font-size: 15px;
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .grid-body td.today-cell { background-color: #F4F8FF; }
  .grid-body td.shift-cell { cursor: pointer; }
  .dot {
    width: 22px;
    height: 22px;
    border-radius: 11px;
    display: inline-block;
    vertical-align: middle;
  }
  /* この週だけの変更（テンプレと異なる）には白いリング */
  .dot.edited {
    box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px rgba(0,0,0,0.18);
  }
  .off-mark {
    display: inline-block;
    width: 22px;
    height: 22px;
    border-radius: 11px;
    border: 1.5px dashed #C7C7CC;
    vertical-align: middle;
  }
  .name-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 5px;
    margin-right: 7px;
    vertical-align: middle;
  }
  .grid-total td {
    height: 34px;
    border-top: 0.5px solid #E5E5EA;
    font-size: 13px;
    font-weight: 600;
    color: #8E8E93;
    background-color: #FAFAFA;
  }
  .grid-total .total-label {
    text-align: left;
    padding-left: 16px;
  }
  .grid-total .total-num.today-cell { background-color: #F4F8FF; }
  .grid-hint {
    text-align: center;
    color: #8E8E93;
    font-size: 13px;
    margin-top: 14px;
    line-height: 1.5;
  }

  /* ===== Week navigation ===== */
  .week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .week-arrow {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    background-color: #FFFFFF;
    border: none;
    font-size: 24px;
    color: #007AFF;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .week-arrow:active { background-color: #E5E5EA; }
  .week-nav-center { text-align: center; flex: 1; }
  .week-month {
    font-size: 20px;
    font-weight: 700;
    color: #000000;
    line-height: 1.1;
  }
  .week-range {
    font-size: 12px;
    color: #8E8E93;
    margin-top: 2px;
  }
  .grid-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .pill-btn {
    background-color: #EAF3FF;
    color: #007AFF;
    border: none;
    border-radius: 16px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .pill-btn:active { opacity: 0.6; }
  .pill-btn.reset { background-color: #FFF0EF; color: #FF3B30; }

  /* ===== Members list ===== */
  .member-list {
    background-color: #FFFFFF;
    border-radius: 14px;
    overflow: hidden;
  }
  .member-row {
    display: flex;
    align-items: center;
    padding: 13px 16px;
    border-bottom: 0.5px solid #E5E5EA;
    cursor: pointer;
  }
  .member-row:last-child { border-bottom: none; }
  .member-info { flex: 1; min-width: 0; }
  .member-name {
    font-size: 17px;
    font-weight: 400;
    margin-bottom: 3px;
  }
  .member-days {
    font-size: 13px;
    color: #8E8E93;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .chevron {
    color: #C7C7CC;
    font-size: 20px;
    margin-left: 8px;
  }

  .data-actions {
    margin-top: 26px;
    background-color: #FFFFFF;
    border-radius: 14px;
    overflow: hidden;
  }
  .data-btn {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 0.5px solid #E5E5EA;
    padding: 15px 16px;
    font-size: 16px;
    color: #007AFF;
    cursor: pointer;
    text-align: left;
  }
  .data-btn:last-child { border-bottom: none; }
  .data-note {
    font-size: 12px;
    color: #8E8E93;
    text-align: center;
    margin-top: 10px;
    padding: 0 12px;
    line-height: 1.5;
  }

  /* ===== Sheet modal ===== */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 100;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #F2F2F7;
    border-radius: 14px 14px 0 0;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    z-index: 101;
    padding-bottom: env(safe-area-inset-bottom);
    max-height: 92vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px;
    height: 5px;
    background-color: #C6C6C8;
    border-radius: 3px;
    margin: 8px auto 0;
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .sheet-title { font-size: 17px; font-weight: 600; }
  .sheet-cancel, .sheet-save {
    font-size: 16px;
    color: #007AFF;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }
  .sheet-save { font-weight: 600; }
  .sheet-body { padding: 6px 16px 24px; }

  .field-label {
    font-size: 13px;
    color: #6D6D72;
    margin: 18px 4px 7px;
  }
  .text-input {
    width: 100%;
    background-color: #FFFFFF;
    border: none;
    border-radius: 11px;
    padding: 14px 16px;
    font-size: 17px;
    outline: none;
  }
  .color-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    background-color: #FFFFFF;
    border-radius: 11px;
    padding: 16px;
  }
  .color-swatch {
    width: 36px;
    height: 36px;
    border-radius: 18px;
    cursor: pointer;
    position: relative;
  }
  .color-swatch.selected::after {
    content: "✓";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 700;
  }
  .day-toggles {
    display: flex;
    gap: 7px;
    justify-content: space-between;
  }
  .day-toggle {
    flex: 1;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background-color: #FFFFFF;
    border: 1.5px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 600;
    color: #C7C7CC;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .day-toggle.on {
    background-color: #007AFF;
    border-color: #007AFF;
    color: #FFFFFF;
  }
  .field-hint {
    font-size: 12px;
    color: #8E8E93;
    margin: 8px 4px 0;
  }
  .delete-btn {
    width: 100%;
    background-color: #FFFFFF;
    border: none;
    border-radius: 11px;
    padding: 15px;
    font-size: 17px;
    color: #FF3B30;
    cursor: pointer;
    margin-top: 28px;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(96px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background-color: rgba(0,0,0,0.82);
    color: #FFFFFF;
    font-size: 14px;
    font-weight: 500;
    padding: 11px 20px;
    border-radius: 22px;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 80%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== Tab bar ===== */
  .tab-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(56px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background-color: rgba(249, 249, 249, 0.9);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid #C6C6C8;
    display: flex;
    z-index: 60;
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: #8E8E93;
    cursor: pointer;
    background: none;
    border: none;
  }
  .tab-item.active { color: #007AFF; }
  .tab-icon { width: 26px; height: 26px; }
  .tab-label { font-size: 10px; font-weight: 500; }

  /* ===== Dark mode (iOS) ===== */
  @media (prefers-color-scheme: dark) {
    html, body {
      background-color: #000000;
      color: #FFFFFF;
    }

    .header {
      background-color: rgba(28, 28, 30, 0.8);
      border-bottom-color: #38383A;
    }
    .header-title { color: #FFFFFF; }
    .header-btn { color: #0A84FF; }

    .today-card,
    .work-list,
    .empty-state,
    .grid-wrap,
    .member-list,
    .data-actions { background-color: #1C1C1E; }

    .today-dow.weekday { color: #FFFFFF; }
    .today-dow.sat { color: #0A84FF; }
    .today-dow.sun { color: #FF453A; }

    .work-row,
    .member-row,
    .data-btn { border-bottom-color: #38383A; }

    .grid-head .name-col,
    .grid-head .date-th,
    .grid-body td,
    .grid-total td { border-color: #38383A; }
    .grid-total td { border-top-color: #38383A; }

    .grid-head .dow-th.sat-h { color: #0A84FF; }
    .grid-head .dow-th.sun-h { color: #FF453A; }
    .grid-head .date-num { color: #FFFFFF; }
    .grid-head .date-th.today .date-num { background-color: #0A84FF; color: #FFFFFF; }
    .grid-head .today-col { background-color: rgba(10, 132, 255, 0.16); }
    .grid-body td.today-cell,
    .grid-total .total-num.today-cell { background-color: rgba(10, 132, 255, 0.10); }
    .grid-total td { background-color: #161618; }

    .off-mark { border-color: #48484A; }
    .dot.edited { box-shadow: 0 0 0 2px #1C1C1E, 0 0 0 3.5px rgba(255, 255, 255, 0.3); }

    .week-arrow { background-color: #1C1C1E; color: #0A84FF; }
    .week-arrow:active { background-color: #2C2C2E; }
    .week-month { color: #FFFFFF; }

    .pill-btn { background-color: rgba(10, 132, 255, 0.22); color: #0A84FF; }
    .pill-btn.reset { background-color: rgba(255, 69, 58, 0.20); color: #FF453A; }

    .chevron { color: #48484A; }
    .data-btn { color: #0A84FF; }

    .sheet { background-color: #1C1C1E; }
    .sheet-handle { background-color: #48484A; }
    .sheet-cancel, .sheet-save { color: #0A84FF; }

    .text-input,
    .color-row,
    .day-toggle,
    .delete-btn { background-color: #2C2C2E; }
    .text-input { color: #FFFFFF; }
    .text-input::placeholder { color: #8E8E93; }
    .day-toggle { border-color: #2C2C2E; color: #636366; }
    .day-toggle.on { background-color: #0A84FF; border-color: #0A84FF; color: #FFFFFF; }
    .delete-btn { color: #FF453A; }

    .tab-bar {
      background-color: rgba(28, 28, 30, 0.8);
      border-top-color: #38383A;
    }
    .tab-item.active { color: #0A84FF; }

    .toast { background-color: rgba(70, 70, 72, 0.96); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <button class="header-btn" id="headerLeft" style="visibility:hidden;">編集</button>
    <div class="header-title" id="headerTitle">今日の出勤</div>
    <button class="header-btn add" id="headerAdd" style="visibility:hidden;">+</button>
  </div>
</div>

<!-- 今日 -->
<div class="page active" id="page-today">
  <div class="today-card">
    <div class="today-date" id="todayDate">—</div>
    <div class="today-dow weekday" id="todayDow">—</div>
    <div class="today-count" id="todayCount"></div>
  </div>
  <div class="section-label">出勤するメンバー</div>
  <div id="todayList"></div>
</div>

<!-- 週間表 -->
<div class="page" id="page-grid">
  <div class="week-nav">
    <button class="week-arrow" id="prevWeek" aria-label="前の週">‹</button>
    <div class="week-nav-center">
      <div class="week-month" id="weekMonth">—</div>
      <div class="week-range" id="weekRange">—</div>
    </div>
    <button class="week-arrow" id="nextWeek" aria-label="次の週">›</button>
  </div>
  <div class="grid-actions">
    <button class="pill-btn" id="thisWeekBtn" style="display:none;">今週に戻る</button>
    <button class="pill-btn" id="shareBtn">この週を共有</button>
    <button class="pill-btn reset" id="resetWeekBtn" style="display:none;">変更をリセット</button>
  </div>
  <div class="grid-wrap">
    <table class="grid-table">
      <thead class="grid-head">
        <tr id="gridHeadDow"></tr>
        <tr id="gridHeadDate"></tr>
      </thead>
      <tbody class="grid-body" id="gridBody"></tbody>
    </table>
  </div>
  <div class="grid-hint">マスをタップでこの週の出勤を変更<br>繰り返しの基本シフトは「メンバー」で設定</div>
</div>

<!-- メンバー -->
<div class="page" id="page-members">
  <div class="member-list" id="memberList"></div>
  <div class="data-actions" id="dataActions" style="display:none;">
    <button class="data-btn" id="exportBtn">データを書き出す（バックアップ）</button>
    <button class="data-btn" id="importBtn">データを読み込む（復元）</button>
  </div>
  <div class="data-note" id="dataNote" style="display:none;">
    データはこの端末のブラウザにのみ保存されます。機種変更や履歴消去で消えることがあるので、ときどき書き出しておくと安心です。
  </div>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
</div>

<!-- Sheet -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <button class="sheet-cancel" id="sheetCancel">キャンセル</button>
    <div class="sheet-title" id="sheetTitle">メンバーを追加</div>
    <button class="sheet-save" id="sheetSave">保存</button>
  </div>
  <div class="sheet-body">
    <div class="field-label">名前</div>
    <input class="text-input" id="inputName" type="text" placeholder="名前を入力" maxlength="12">

    <div class="field-label">カラー</div>
    <div class="color-row" id="colorRow"></div>

    <div class="field-label">出勤する曜日（繰り返し）</div>
    <div class="day-toggles" id="dayToggles"></div>
    <div class="field-hint">毎週この曜日に出勤する基本設定です。特定の日だけの変更は「週間表」で行えます。</div>

    <button class="delete-btn" id="deleteBtn" style="display:none;">このメンバーを削除</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Tab bar -->
<div class="tab-bar">
  <button class="tab-item active" data-tab="today">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9L12 2.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span class="tab-label">今日</span>
  </button>
  <button class="tab-item" data-tab="grid">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M9 9v11M15 9v11" stroke="currentColor" stroke-width="1.4"/></svg>
    <span class="tab-label">週間表</span>
  </button>
  <button class="tab-item" data-tab="members">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20c0-3.7 3.4-6 7.5-6s7.5 2.3 7.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span class="tab-label">メンバー</span>
  </button>
</div>

<script>
  var DOW = ["月","火","水","木","金","土","日"];
  var COLORS = ["#FF3B30","#FF9500","#FFCC00","#34C759","#00C7BE","#007AFF","#5856D6","#AF52DE","#FF2D55","#A2845E"];
  var STORE_KEY = "shift-app-data-v1";

  var members = [];
  var currentTab = "today";
  var viewWeekOffset = 0;     // 0=今週, -1=先週, +1=来週
  var editingId = null;       // null = 新規追加
  var draft = { name:"", color:COLORS[5], days:[false,false,false,false,false,false,false] };

  // ---- 永続化 ----
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) members = JSON.parse(raw);
    } catch(e) { members = []; }
    // マイグレーション: overrides フィールドを保証
    members.forEach(function(m){
      if (!m.overrides || typeof m.overrides !== "object") m.overrides = {};
      if (!Array.isArray(m.days)) m.days = [false,false,false,false,false,false,false];
    });
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(members)); } catch(e) {}
  }

  function todayIndex() {
    // getDay: 0=日..6=土  →  月=0..日=6
    return (new Date().getDay() + 6) % 7;
  }

  function startOfToday() {
    var d = new Date(); d.setHours(0,0,0,0); return d;
  }
  function mondayOfViewedWeek() {
    var d = startOfToday();
    var ti = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - ti + viewWeekOffset * 7);
    return d;
  }
  function sameDate(a, b) {
    return a.getFullYear()===b.getFullYear()
        && a.getMonth()===b.getMonth()
        && a.getDate()===b.getDate();
  }
  function dateKey(d) {
    return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate();
  }
  function weekdayIndex(d) {
    return (d.getDay() + 6) % 7;
  }

  // ---- 出勤判定（繰り返し + 特定日の上書き）----
  function isWorking(mem, dateObj) {
    var key = dateKey(dateObj);
    if (mem.overrides && Object.prototype.hasOwnProperty.call(mem.overrides, key)) {
      return !!mem.overrides[key];
    }
    return !!mem.days[weekdayIndex(dateObj)];
  }
  function isEdited(mem, dateObj) {
    var key = dateKey(dateObj);
    return mem.overrides && Object.prototype.hasOwnProperty.call(mem.overrides, key);
  }
  function toggleWorking(mem, dateObj) {
    if (!mem.overrides) mem.overrides = {};
    var key = dateKey(dateObj);
    var template = !!mem.days[weekdayIndex(dateObj)];
    var current = isWorking(mem, dateObj);
    var next = !current;
    if (next === template) {
      // テンプレートと一致したら上書きは不要
      delete mem.overrides[key];
    } else {
      mem.overrides[key] = next;
    }
  }

  function initial(name) {
    return name ? name.trim().charAt(0) : "?";
  }

  // ---- 今日 ----
  function renderToday() {
    var now = startOfToday();
    var ti = todayIndex();
    var m = now.getMonth() + 1, d = now.getDate();
    document.getElementById("todayDate").textContent = m + "月" + d + "日";

    var dowEl = document.getElementById("todayDow");
    dowEl.textContent = DOW[ti] + "曜日";
    dowEl.className = "today-dow " + (ti === 5 ? "sat" : ti === 6 ? "sun" : "weekday");

    var working = members.filter(function(x){ return isWorking(x, now); });
    document.getElementById("todayCount").textContent = working.length + "人が出勤";

    var list = document.getElementById("todayList");
    if (working.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="big">🌴</div>今日は出勤なし</div>';
      return;
    }
    var html = '<div class="work-list">';
    working.forEach(function(x){
      html += '<div class="work-row">'
        + '<div class="avatar" style="background-color:'+x.color+'">'+escapeHtml(initial(x.name))+'</div>'
        + '<div class="work-name">'+escapeHtml(x.name)+'</div>'
        + '</div>';
    });
    html += '</div>';
    list.innerHTML = html;
  }

  // ---- 週間表 ----
  function weekHasOverrides(dates) {
    return members.some(function(x){
      return dates.some(function(dd){ return isEdited(x, dd); });
    });
  }

  function renderGrid() {
    var monday = mondayOfViewedWeek();
    var today = startOfToday();
    var dates = [];
    for (var i=0;i<7;i++){
      var dd = new Date(monday); dd.setDate(monday.getDate()+i); dates.push(dd);
    }
    var first = dates[0], last = dates[6];

    var monthLabel = first.getMonth()===last.getMonth()
      ? first.getFullYear()+"年"+(first.getMonth()+1)+"月"
      : first.getFullYear()+"年"+(first.getMonth()+1)+"月–"+(last.getMonth()+1)+"月";
    document.getElementById("weekMonth").textContent = monthLabel;
    document.getElementById("weekRange").textContent =
      (first.getMonth()+1)+"/"+first.getDate()+" – "+(last.getMonth()+1)+"/"+last.getDate();
    document.getElementById("thisWeekBtn").style.display = (viewWeekOffset===0) ? "none" : "inline-block";
    document.getElementById("resetWeekBtn").style.display = weekHasOverrides(dates) ? "inline-block" : "none";

    // ヘッダー（曜日 + 日付）
    var dowRow = '<th class="name-col" rowspan="2">名前</th>';
    var dateRow = "";
    for (var i=0;i<7;i++){
      var isToday = sameDate(dates[i], today);
      var dowCls = "dow-th" + (i===5?" sat-h":i===6?" sun-h":"") + (isToday?" today-col":"");
      dowRow += '<th class="'+dowCls+'">'+DOW[i]+'</th>';
      var dateCls = "date-th" + (isToday?" today today-col":"");
      dateRow += '<th class="'+dateCls+'"><span class="date-num">'+dates[i].getDate()+'</span></th>';
    }
    document.getElementById("gridHeadDow").innerHTML = dowRow;
    document.getElementById("gridHeadDate").innerHTML = dateRow;

    var body = document.getElementById("gridBody");
    if (members.length === 0) {
      body.innerHTML = '<tr><td colspan="8" style="padding:32px;color:#8E8E93;font-size:15px;">メンバータブの＋から追加</td></tr>';
      return;
    }
    var html = "";
    var totals = [0,0,0,0,0,0,0];
    members.forEach(function(x){
      html += '<tr>';
      html += '<td class="name-cell"><span class="name-dot" style="background-color:'+x.color+'"></span>'+escapeHtml(x.name)+'</td>';
      for (var i=0;i<7;i++){
        var isToday = sameDate(dates[i], today);
        var working = isWorking(x, dates[i]);
        var edited = isEdited(x, dates[i]);
        if (working) totals[i]++;
        var cellCls = "shift-cell" + (isToday ? " today-cell" : "");
        var mark = working
          ? '<span class="dot'+(edited?' edited':'')+'" style="background-color:'+x.color+'"></span>'
          : (edited ? '<span class="off-mark"></span>' : '');
        html += '<td class="'+cellCls+'" data-id="'+x.id+'" data-key="'+dateKey(dates[i])+'">'+mark+'</td>';
      }
      html += '</tr>';
    });
    // 合計行
    html += '<tr class="grid-total"><td class="total-label">合計</td>';
    for (var i=0;i<7;i++){
      var isToday = sameDate(dates[i], today);
      html += '<td class="total-num'+(isToday?' today-cell':'')+'">'+totals[i]+'</td>';
    }
    html += '</tr>';
    body.innerHTML = html;

    var cells = body.querySelectorAll("td.shift-cell");
    cells.forEach(function(td){
      td.addEventListener("click", function(){
        var id = td.getAttribute("data-id");
        var key = td.getAttribute("data-key");
        var mem = members.find(function(z){ return String(z.id)===String(id); });
        if (!mem) return;
        // data-key から日付を復元
        var parts = key.split("-");
        var dObj = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
        toggleWorking(mem, dObj);
        save();
        renderGrid();
      });
    });
  }

  // ---- メンバー一覧 ----
  function renderMembers() {
    var list = document.getElementById("memberList");
    var dataActions = document.getElementById("dataActions");
    var dataNote = document.getElementById("dataNote");
    if (members.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="big">👥</div>右上の＋からメンバーを追加</div>';
      list.className = "";
      dataActions.style.display = "none";
      dataNote.style.display = "none";
      return;
    }
    list.className = "member-list";
    dataActions.style.display = "block";
    dataNote.style.display = "block";
    var html = "";
    members.forEach(function(x){
      var days = x.days.map(function(on,i){ return on?DOW[i]:null; }).filter(Boolean);
      var daysText = days.length ? days.join("・") : "出勤日なし";
      html += '<div class="member-row" data-id="'+x.id+'">'
        + '<div class="avatar" style="background-color:'+x.color+'">'+escapeHtml(initial(x.name))+'</div>'
        + '<div class="member-info">'
        + '<div class="member-name">'+escapeHtml(x.name)+'</div>'
        + '<div class="member-days">'+daysText+'</div>'
        + '</div>'
        + '<div class="chevron">›</div>'
        + '</div>';
    });
    list.innerHTML = html;
    list.querySelectorAll(".member-row").forEach(function(row){
      row.addEventListener("click", function(){
        openSheet(row.getAttribute("data-id"));
      });
    });
  }

  // ---- Sheet ----
  function buildColorRow() {
    var row = document.getElementById("colorRow");
    row.innerHTML = "";
    COLORS.forEach(function(c){
      var sw = document.createElement("div");
      sw.className = "color-swatch" + (c===draft.color ? " selected" : "");
      sw.style.backgroundColor = c;
      sw.addEventListener("click", function(){
        draft.color = c;
        buildColorRow();
      });
      row.appendChild(sw);
    });
  }
  function buildDayToggles() {
    var wrap = document.getElementById("dayToggles");
    wrap.innerHTML = "";
    DOW.forEach(function(label,i){
      var t = document.createElement("div");
      t.className = "day-toggle" + (draft.days[i] ? " on" : "");
      t.textContent = label;
      t.addEventListener("click", function(){
        draft.days[i] = !draft.days[i];
        buildDayToggles();
      });
      wrap.appendChild(t);
    });
  }

  function openSheet(id) {
    if (id) {
      var mem = members.find(function(z){ return String(z.id)===String(id); });
      editingId = mem.id;
      draft = { name: mem.name, color: mem.color, days: mem.days.slice() };
      document.getElementById("sheetTitle").textContent = "メンバーを編集";
      document.getElementById("deleteBtn").style.display = "block";
    } else {
      editingId = null;
      draft = { name:"", color: COLORS[Math.floor(Math.random()*COLORS.length)], days:[false,false,false,false,false,false,false] };
      document.getElementById("sheetTitle").textContent = "メンバーを追加";
      document.getElementById("deleteBtn").style.display = "none";
    }
    document.getElementById("inputName").value = draft.name;
    buildColorRow();
    buildDayToggles();
    document.getElementById("sheetOverlay").classList.add("open");
    document.getElementById("sheet").classList.add("open");
  }
  function closeSheet() {
    document.getElementById("sheetOverlay").classList.remove("open");
    document.getElementById("sheet").classList.remove("open");
    document.getElementById("inputName").blur();
  }

  document.getElementById("inputName").addEventListener("input", function(e){
    draft.name = e.target.value;
  });
  document.getElementById("sheetCancel").addEventListener("click", closeSheet);
  document.getElementById("sheetOverlay").addEventListener("click", closeSheet);
  document.getElementById("sheetSave").addEventListener("click", function(){
    var name = draft.name.trim();
    if (!name) { document.getElementById("inputName").focus(); return; }
    if (editingId !== null) {
      var mem = members.find(function(z){ return z.id===editingId; });
      mem.name = name; mem.color = draft.color; mem.days = draft.days.slice();
    } else {
      members.push({ id: Date.now(), name: name, color: draft.color, days: draft.days.slice(), overrides: {} });
    }
    save();
    closeSheet();
    renderAll();
  });
  document.getElementById("deleteBtn").addEventListener("click", function(){
    if (editingId === null) return;
    if (confirm("このメンバーを削除しますか？")) {
      members = members.filter(function(z){ return z.id!==editingId; });
      save();
      closeSheet();
      renderAll();
    }
  });

  // ---- 共有 ----
  function buildShareText() {
    var monday = mondayOfViewedWeek();
    var dates = [];
    for (var i=0;i<7;i++){ var dd=new Date(monday); dd.setDate(monday.getDate()+i); dates.push(dd); }
    var first = dates[0], last = dates[6];
    var text = "📅 シフト管理表 "
      + (first.getMonth()+1)+"/"+first.getDate()+"〜"+(last.getMonth()+1)+"/"+last.getDate()+"\n\n";
    dates.forEach(function(dd,i){
      var names = members.filter(function(x){ return isWorking(x, dd); }).map(function(x){ return x.name; });
      text += (dd.getMonth()+1)+"/"+dd.getDate()+"("+DOW[i]+") "
        + (names.length ? names.join("、") : "休み") + "\n";
    });
    return text.trim();
  }
  document.getElementById("shareBtn").addEventListener("click", function(){
    var text = buildShareText();
    if (navigator.share) {
      navigator.share({ text: text }).catch(function(){});
    } else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ showToast("コピーしました"); })
        .catch(function(){ fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  });
  function fallbackCopy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast("コピーしました");
    } catch(e) { showToast("コピーできませんでした"); }
  }

  // ---- 週の変更リセット ----
  document.getElementById("resetWeekBtn").addEventListener("click", function(){
    var monday = mondayOfViewedWeek();
    var keys = [];
    for (var i=0;i<7;i++){ var dd=new Date(monday); dd.setDate(monday.getDate()+i); keys.push(dateKey(dd)); }
    if (!confirm("この週の変更を取り消して、基本シフトに戻しますか？")) return;
    members.forEach(function(x){
      keys.forEach(function(k){ if (x.overrides) delete x.overrides[k]; });
    });
    save();
    renderGrid();
    showToast("基本シフトに戻しました");
  });

  // ---- データ書き出し / 読み込み ----
  document.getElementById("exportBtn").addEventListener("click", function(){
    var data = JSON.stringify(members, null, 2);
    var blob = new Blob([data], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var now = new Date();
    a.href = url;
    a.download = "shift-backup-" + now.getFullYear() + "" + ("0"+(now.getMonth()+1)).slice(-2) + ("0"+now.getDate()).slice(-2) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("バックアップを書き出しました");
  });
  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try {
        var parsed = JSON.parse(ev.target.result);
        if (!Array.isArray(parsed)) throw new Error("形式が違います");
        if (!confirm("読み込むと現在のデータは置き換えられます。続けますか？")) return;
        members = parsed;
        members.forEach(function(m){
          if (!m.overrides || typeof m.overrides !== "object") m.overrides = {};
          if (!Array.isArray(m.days)) m.days = [false,false,false,false,false,false,false];
        });
        save();
        renderAll();
        showToast("データを読み込みました");
      } catch(err) {
        showToast("読み込めませんでした");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  // ---- Toast ----
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  // ---- タブ切り替え ----
  function switchTab(tab) {
    currentTab = tab;
    if (tab === "grid") viewWeekOffset = 0;
    document.querySelectorAll(".tab-item").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab")===tab);
    });
    document.getElementById("page-today").classList.toggle("active", tab==="today");
    document.getElementById("page-grid").classList.toggle("active", tab==="grid");
    document.getElementById("page-members").classList.toggle("active", tab==="members");

    var title = tab==="today" ? "今日の出勤" : tab==="grid" ? "週間シフト表" : "メンバー";
    document.getElementById("headerTitle").textContent = title;
    var add = document.getElementById("headerAdd");
    add.style.visibility = (tab==="members") ? "visible" : "hidden";

    renderAll();
  }
  document.querySelectorAll(".tab-item").forEach(function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });
  document.getElementById("headerAdd").addEventListener("click", function(){ openSheet(null); });

  document.getElementById("prevWeek").addEventListener("click", function(){ viewWeekOffset--; renderGrid(); });
  document.getElementById("nextWeek").addEventListener("click", function(){ viewWeekOffset++; renderGrid(); });
  document.getElementById("thisWeekBtn").addEventListener("click", function(){ viewWeekOffset=0; renderGrid(); });

  function renderAll() {
    renderToday();
    renderGrid();
    renderMembers();
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  load();
  switchTab("grid");

  // ---- PWA: Service Worker 登録 ----
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
</script>
</body>
</html>
